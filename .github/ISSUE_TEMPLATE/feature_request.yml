name: Feature Request
description: Suggest a new feature or improvement
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Have an idea that would make SN Explorer more useful? We'd love to hear it.

  - type: textarea
    id: summary
    attributes:
      label: What would you like to see?
      description: A short description of the feature or improvement.
      placeholder: "e.g. Add a search filter for patterns by credential type..."
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the use case or pain point this would address.
      placeholder: "e.g. When I'm looking for patterns that use SSH credentials, I have to scroll through all patterns manually..."
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: Which area of the app does this relate to?
      options:
        - Patterns
        - Classifiers
        - Discovery Stages
        - IRE & Reconciliation
        - Discovery Credentials
        - MID Server
        - AI Assistant / RAG
        - Navigation / UI
        - Sync Scripts
        - New Section entirely
        - Other
    validations:
      required: false
